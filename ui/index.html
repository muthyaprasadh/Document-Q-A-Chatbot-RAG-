<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endee RAG Q&A</title>
  <style>
    body { max-width: 760px; margin: 48px auto; font-family: system-ui, sans-serif; padding: 0 20px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 6px; min-height: 32px; }
  </style>
</head>
<body>
  <h2>AI Document Question Answering</h2>
  <div class="row">
    <input id="q" placeholder="Ask a question" aria-label="Question">
    <button onclick="ask()">Ask</button>
  </div>
  <pre id="ans"></pre>

  <script>
    async function ask() {
      const q = document.getElementById("q").value.trim();
      const output = document.getElementById("ans");
      if (!q) {
        output.innerText = "Please enter a question.";
        return;
      }
      output.innerText = "Thinking...";
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        output.innerText = res.ok ? data.answer : (data.detail || "Request failed.");
      } catch (error) {
        output.innerText = "Unable to reach the server.";
      }
    }
    document.getElementById("q").addEventListener("keydown", event => {
      if (event.key === "Enter") ask();
    });
  </script>
</body>
</html>
